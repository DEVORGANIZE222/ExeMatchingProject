worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hide nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream services
    upstream identity_service {
        server identity-semester:8080;
    }

    upstream group_matching_service {
        server group-matching:8080;
    }

    upstream mentor_service {
        server mentor:8080;
    }

    # Shared proxy settings
    map $request_uri $proxy_host_header {
        default $host;
    }

    server {
        listen 80;
        server_name _;

        # Rate limiting
        limit_req zone=api_limit burst=50 nodelay;

        # Request size limit
        client_max_body_size 10m;

        # ─── CORS Configuration ───
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ─── Health Check ───

        location = / {
            return 200 '{"system":"EXE Team Matching API Gateway","status":"Online","version":"1.0.0","services":{"identity":"/api/auth, /api/students, /api/semesters","groups":"/api/groups, /api/matching","mentor":"/api/mentors, /api/mentor-requests"}}';
        }

        location = /health {
            return 200 '{"status":"Healthy"}';
        }

        # ─── Identity & Semester Service ───
        location /api/auth {
            proxy_pass http://identity_service;
            include /etc/nginx/proxy_params;
        }

        location /api/students {
            proxy_pass http://identity_service;
            include /etc/nginx/proxy_params;
        }

        location /api/semesters {
            proxy_pass http://identity_service;
            include /etc/nginx/proxy_params;
        }

        # ─── Group & Matching Service ───
        location /api/groups {
            proxy_pass http://group_matching_service;
            include /etc/nginx/proxy_params;
        }

        location /api/matching {
            proxy_pass http://group_matching_service;
            include /etc/nginx/proxy_params;
        }

        # ─── Mentor Service ───
        location /api/mentors {
            proxy_pass http://mentor_service;
            include /etc/nginx/proxy_params;
        }

        location /api/mentor-requests {
            proxy_pass http://mentor_service;
            include /etc/nginx/proxy_params;
        }

        # ─── Block everything else ───
        location / {
            return 404 '{"error":"Not Found","message":"The requested endpoint does not exist. See / for available routes."}';
        }
    }
}

services:
  # 1. API Gateway (Nginx)
  - type: web
    name: exe-api-gateway
    env: docker
    dockerfilePath: be/src/Gateway/nginx/Dockerfile
    dockerContext: be/src/Gateway/nginx
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: IDENTITY_SERVICE_URL
        sync: false
      - key: GROUP_MATCHING_SERVICE_URL
        sync: false
      - key: MENTOR_SERVICE_URL
        sync: false

  # 2. Identity & Semester Service
  - type: web
    name: exe-identity-semester
    env: docker
    dockerfilePath: be/src/Services/IdentitySemester/IdentitySemester.Api/Dockerfile
    dockerContext: be
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__Secret
        sync: false
      - key: GoogleAuth__ClientIds__0
        sync: false
      - key: KafkaSettings__BootstrapServers
        sync: false
      - key: KafkaSettings__SecurityProtocol
        value: SASL_SSL
      - key: KafkaSettings__SaslMechanism
        value: SCRAM-SHA-256
      - key: KafkaSettings__SaslUsername
        sync: false
      - key: KafkaSettings__SaslPassword
        sync: false

  # 3. Group Matching Service
  - type: web
    name: exe-group-matching
    env: docker
    dockerfilePath: be/src/Services/GroupMatching/GroupMatching.Api/Dockerfile
    dockerContext: be
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__Secret
        sync: false
      - key: IdentitySemester__BaseUrl
        sync: false
      - key: MentorGrpc__Address
        sync: false
      - key: MentorGrpc__UseGrpcWeb
        value: "true"
      - key: KafkaSettings__BootstrapServers
        sync: false
      - key: KafkaSettings__SecurityProtocol
        value: SASL_SSL
      - key: KafkaSettings__SaslMechanism
        value: SCRAM-SHA-256
      - key: KafkaSettings__SaslUsername
        sync: false
      - key: KafkaSettings__SaslPassword
        sync: false

  # 4. Mentor Service
  - type: web
    name: exe-mentor
    env: docker
    dockerfilePath: be/src/Services/Mentor/Mentor.Api/Dockerfile
    dockerContext: be
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__Secret
        sync: false
      - key: IdentitySemester__BaseUrl
        sync: false
      - key: GroupMatching__BaseUrl
        sync: false
      - key: KafkaSettings__BootstrapServers
        sync: false
      - key: KafkaSettings__SecurityProtocol
        value: SASL_SSL
      - key: KafkaSettings__SaslMechanism
        value: SCRAM-SHA-256
      - key: KafkaSettings__SaslUsername
        sync: false
      - key: KafkaSettings__SaslPassword
        sync: false

  # 5. Notification Worker Service (runs minimal web /health for Render Free)
  - type: web
    name: exe-notification-worker
    env: docker
    dockerfilePath: be/src/Services/Notification/Notification.Worker/Dockerfile
    dockerContext: be
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: KafkaSettings__BootstrapServers
        sync: false
      - key: KafkaSettings__SecurityProtocol
        value: SASL_SSL
      - key: KafkaSettings__SaslMechanism
        value: SCRAM-SHA-256
      - key: KafkaSettings__SaslUsername
        sync: false
      - key: KafkaSettings__SaslPassword
        sync: false
      - key: EmailSettings__SmtpServer
        value: smtp.gmail.com
      - key: EmailSettings__SmtpPort
        value: "587"
      - key: EmailSettings__Username
        sync: false
      - key: EmailSettings__Password
        sync: false
      - key: EmailSettings__SenderEmail
        sync: false
      - key: EmailSettings__SenderName
        value: ExeMatching Team
